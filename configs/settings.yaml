# ============================================================
# ClinKey — central configuration
# Secrets (API keys) live in .env, never here.
# ============================================================

app:
  name: "ClinKey"
  tagline: "Medical Evidence RAG"
  version: "1.0.0"
  disclaimer: >
    ClinKey provides general, evidence-grounded medical information drawn from
    official public guidelines. It does NOT diagnose, treat, or replace
    professional medical advice. In an emergency, contact local emergency
    services immediately.

llm:
  # "gemini" (uses GEMINI_API_KEY) or "demo" (self-contained, no key needed)
  provider: "auto"            # auto -> gemini if key present, else demo
  model: "gemini-1.5-flash"
  generation_temperature: 0.2
  timeout_seconds: 60

translation:
  provider: "auto"            # auto -> gemini then google-translate bridge
  timeout_seconds: 30

language:
  # Canonical internal language — do not change in the initial version.
  canonical: "en"
  detection_min_confidence: 0.40
  supported:
    - { code: "en", name: "English" }
    - { code: "ar", name: "Arabic" }
    - { code: "fr", name: "French" }
    - { code: "es", name: "Spanish" }
    - { code: "de", name: "German" }
    - { code: "it", name: "Italian" }
    - { code: "pt", name: "Portuguese" }
    - { code: "tr", name: "Turkish" }
    - { code: "hi", name: "Hindi" }
    - { code: "ur", name: "Urdu" }
    - { code: "zh", name: "Chinese" }

safety:
  enabled: true

sources:
  max_selected: 5
  cache_dir: "data/cache"
  # Deterministic fallback router is used when Gemini is unavailable.

ingestion:
  chunk_size_tokens: 500
  chunk_overlap_tokens: 150
  min_chunk_tokens: 40
  min_chunk_chars: 40
  nav_ratio_max: 0.55

embeddings:
  # "sentence-transformers" | "hash" (explicit dev/test only)
  provider: "auto"
  model: "BAAI/bge-small-en-v1.5"
  allow_hash_fallback: false

vectorstore:
  # "chroma" | "memory" (in-process numpy fallback)
  provider: "auto"
  path: "data/vector_db"
  collection: "clinkey_evidence"

retrieval:
  candidate_k: 15
  max_context_chunks: 5
  fusion: rrf
  rrf_k: 60
  reranker_enabled: true
  reranker_backend: heuristic
  # Calibrated 2026-08-19 on 9 labeled pairs (see evaluation/calibrate_reranker.py)
  heuristic_min_rerank: 0.12
  # CE is OFF until calibrated. Do not set backend=cross_encoder without a measured floor.
  cross_encoder_calibrated: false
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  cross_encoder_min_rerank: 0.50
  min_support_score: 0.35
  require_identity: false

confidence:
  thresholds:
    high: 0.80
    medium: 0.65
    low: 0.50
  min_semantic_similarity: 0.70
  generation_threshold: 0.65
  min_strong_hits: 1
  strong_score: 0.50
  min_lexical_overlap: 0.18

grounding:
  validation_enabled: true
  abstention_enabled: true
  trusted_only: true

history:
  path: "data/history"
  persist_queries: true

logging:
  level: "INFO"